var sq={on:false,timer:0,raf:0,seq:[],k:0,c0:0,cyc:0,cb:0,bt:4,total:0,t0:0,spb:.5,o:null,q:[],done:false,endT:0};
function sqStop(){if(typeof micEv!=='undefined'&&micEv&&micEv.on)micFinish();var o=sq.o;sq.on=false;clearInterval(sq.timer);cancelAnimationFrame(sq.raf);sq.q=[];sq.o=null;if(o&&o.show)o.show(-1);}
function sqStart(L,total,bpm,o){
 sqStop();var a=ac(),cb=o.countIn||0,seq=[],j;
 for(j=-cb;j<0;j++)seq.push({b:j,c:1});
 L.forEach(function(x){seq.push(x);});
 if(o.click)for(j=0;j<total;j++)seq.push({b:j,c:1});
 seq.sort(function(x,y){return x.b-y.b;});
 sq.seq=seq;sq.c0=0;for(j=0;j<seq.length;j++)if(seq[j].b>=0){sq.c0=j;break;}
 sq.k=0;sq.cyc=0;sq.cb=cb;sq.bt=o.beats||4;sq.total=total;sq.spb=60/bpm;sq.o=o;sq.q=[];sq.done=false;sq.on=true;
 sq.t0=a.currentTime+0.12;sqSched();sq.timer=setInterval(sqSched,25);sq.raf=requestAnimationFrame(sqAnim);
}
function sqSched(){
 if(!sq.on)return;var a=ac(),now=a.currentTime;
 while(!sq.done&&sq.on){
  var x=sq.seq[sq.k],t=sq.t0+(x.b+sq.cyc*sq.total+sq.cb)*sq.spb;if(t>now+0.15)break;
  if(x.c)click(t,((x.b%sq.bt)+sq.bt)%sq.bt,0);
  else{if(x.m!=null&&!sq.o.mute)pluck(x.m,t,Math.max(0.25,(x.rg||x.du)*sq.spb*0.95),0.35*(x.v||1));else if(x.ms&&!sq.o.mute)x.ms.forEach(function(mm,kk){pluck(mm,t+kk*0.02,Math.max(0.5,x.du*sq.spb*0.95),0.28*(x.v||1));});sq.q.push({t:t,i:x.i});}
  sq.k++;
  if(sq.k>=sq.seq.length){if(sq.o.loop){sq.cyc++;sq.k=sq.c0;}else{sq.done=true;sq.endT=sq.t0+(sq.total+sq.cb)*sq.spb;}}
 }
 if(sq.done&&now>sq.endT+0.05){var o=sq.o;sqStop();if(o&&o.end)o.end();}
}
function sqAnim(){if(!sq.on)return;var now=ac().currentTime;while(sq.q.length&&sq.q[0].t<=now){var e=sq.q.shift();if(micEv.on)micMark(e.i);if(sq.o&&sq.o.show)sq.o.show(e.i);}sq.raf=requestAnimationFrame(sqAnim);}

function ftNext(){clearTimeout(exTimer);ftNew();ftUpd('','');}
function ftTap(s,f){
 if(ft.locked)return;ft.locked=true;ft.total++;var q=ft.q,ok=(s===q.s&&(STDM[s]+f)%12===q.pc);missHit('ft',q.pc,ok);
 playNote(STDM[s]+f);
 if(ok){ft.score++;ft.streak++;}else ft.streak=0;
 ft.res={ok:ok,tap:{s:s,f:f}};
 var fr=[];for(var i=0;i<=12;i++)if((STDM[q.s]+i)%12===q.pc)fr.push(i);
 var msg=ok?'Correcto':(s!==q.s&&(STDM[s]+f)%12===q.pc?'Esa nota es correcta, pero en otra cuerda. Aquí va en el traste '+fr.join(' o '):'No es esa. En esta cuerda está en el traste '+fr.join(' o '));
 ftUpd(msg,ok?'ok':'no');clearTimeout(exTimer);exTimer=setTimeout(ftNext,ok?900:2600);
}
function ftAns(pc){
 if(ft.locked)return;ft.locked=true;ft.total++;var q=ft.q,ok=pc===q.pc;missHit('ft',q.pc,ok);
 playNote(STDM[q.s]+q.f);
 if(ok){ft.score++;ft.streak++;}else ft.streak=0;
 ft.res={ok:ok};ftUpd(ok?'Correcto: '+pcName(q.pc):'Era '+pcName(q.pc),ok?'ok':'no');
 clearTimeout(exTimer);exTimer=setTimeout(ftNext,ok?900:2200);
}

function mlNew(){
 ml.q=[];var p=-1;for(var i=0;i<ml.len;i++){var d;do{d=Math.floor(Math.random()*7);}while(d===p);ml.q.push(d);p=d;}
 ml.inp=[];ml.locked=false;mlUpd('','');mlPlay();
}
function mlTb(){var r=DROOT[st.mlKey||0];return 55+(((NAT[r[0]]+r[1]+12)%12+5)%12);}
function mlN(d){var r=DROOT[st.mlKey||0],sp=spell({l:r[0],a:r[1]},SC.major);return nm(sp[d].l,sp[d].a);}
function mlPlay(){
 var a=ac(),t=a.currentTime+0.05,tb=mlTb();
 [0,4,7].forEach(function(x,i){pluck(tb+x,t+i*0.1,1.1,0.22);});
 ml.q.forEach(function(d,i){pluck(mlTb()+MSEM[d],t+0.95+i*0.6,0.9,0.36);});
}

 for(var i=0;i<ml.len;i++){var has=ml.inp[i]!==undefined,col='var(--ctl)',tx='·',fg='var(--fg)';
  if(has){tx=mlN(ml.inp[i]);if(ml.locked){col=ml.inp[i]===ml.q[i]?'var(--good)':'var(--bad)';fg='var(--on-c)';}else{col='var(--acc-soft)';}}
  h+='<span style="display:inline-grid;place-items:center;width:'+(ml.len>5?40:58)+'px;height:48px;border-radius:12px;background:'+col+';color:'+fg+';font:700 16px var(--head)">'+tx+'</span>';}
 return h;
}

function mlNote(d){
 if(ml.locked||!ml.q.length)return;
 pluck(mlTb()+MSEM[d],ac().currentTime+0.01,0.9,0.36);ml.inp.push(d);
 if(ml.inp.length>=ml.len){
  ml.locked=true;ml.total++;var ok=ml.inp.every(function(x,i){return x===ml.q[i];});if(ok)ml.score++;
  mlUpd(ok?'Correcto':'Era: '+ml.q.map(function(x){return mlN(x);}).join(' · '),ok?'ok':'no');
 }else mlUpd('','');
}

function sgSong(){return SONGS.filter(function(x){return x.id===st.sgId;})[0]||null;}
function sgParse(line){
 var re=/\[(\d+)(?::(m7|M7|m|7|d))?\]/g,out=[],last=0,m;
 while((m=re.exec(line))){var pre=line.slice(last,m.index);if(out.length)out[out.length-1].t+=pre;else if(pre)out.push({c:null,t:pre});out.push({c:{d:+m[1],q:SGQ[m[2]||'']},t:''});last=re.lastIndex;}
 var rest=line.slice(last);if(out.length)out[out.length-1].t+=rest;else out.push({c:null,t:rest});
 return out;
}
function sgChordList(sg){var L=[];sg.s.forEach(function(sec){sec[1].split('|').forEach(function(ln){sgParse(ln).forEach(function(x){if(x.c)L.push(x.c);});});});return L;}
function sgNames(sg){return cmKeyArr(st.sgPc,sg.m);}
function sgCName(sg,c){return lat2(sgNames(sg)[(st.sgPc+c.d)%12])+TQ[c.q].suf;}
function sgBkChords(sg){return sgChordList(sg).map(function(c){return{pc:(st.sgPc+c.d)%12,tp:TQ[c.q],name:sgCName(sg,c),rn:''};});}
function sgUniq(sg){var seen={},out=[];sgChordList(sg).forEach(function(c){var pc=(st.sgPc+c.d)%12,tp=TQ[c.q],k=pc+tp.suf;if(seen[k])return;seen[k]=1;out.push({pc:pc,vq:tp.vq,suf:tp.suf,q:c.q,name:sgCName(sg,c)});});return out;}

function cmRoman(d,q){
 var R=['I','♭II','II','♭III','III','IV','♯IV','V','♭VI','VI','♭VII','VII'],r=R[d];
 if(q==='m'||q==='m7'||q==='dim'||q==='m7b5')r=r.toLowerCase();

}

 sg.s.slice(0,3).forEach(function(sec,i){
  var L=[];sec[1].split('|').forEach(function(ln){sgParse(ln).forEach(function(x){if(x.c)L.push(x.c);});});
  ns[ks[i]]=L.slice(0,64).map(function(c){var dg=cmDeg(c.d),mo=st.cmMode;if(dg>=0){if(c.q===CM_Q3[mo][dg])return cmMk(dg,false);if(c.q===CM_Q7[mo][dg])return cmMk(dg,true);}return{d:c.d,q:c.q,rn:cmRoman(c.d,c.q),k:'x'};});
 });

var LES=[
 {id:'notas',t:'Las 12 notas',hook:'Toda la música occidental se hace con solo 12 notas. Cuando se acaban, vuelven a empezar, como las horas de un reloj.',
  body:function(){
   var chips='';for(var i=0;i<12;i++){var nat=[0,2,4,5,7,9,11].indexOf(i)>=0;chips+='<button class="'+(nat?'nat':'')+'" data-a="nplay" data-v="'+i+'" aria-label="'+pcn(i)+'">'+pcn(i)+'</button>';}
   return'<p>Las notas "naturales" son <b>Do Re Mi Fa Sol La Si</b>. Entre casi todas hay una nota intermedia: el sostenido (♯) sube medio paso y el bemol (♭) lo baja. Do♯ y Re♭ son la misma nota con dos nombres.</p><div class="nchips">'+chips+'</div><p class="muted">Toca cada nota para oírla. Las oscuras son las naturales.</p><ul><li>La distancia más pequeña se llama <b>semitono</b>. En la guitarra es exactamente un traste.</li><li>Entre Mi y Fa, y entre Si y Do, no hay nota intermedia.</li></ul>'+row([sb('Escuchar las 12 notas','play:chrom',1)]);}},
 {id:'tonos',t:'Tonos y semitonos',hook:'Un traste es un semitono. Dos trastes son un tono. Con eso ya puedes medir cualquier cosa en la guitarra.',
  body:function(){return'<p>Si pulsas el traste 5 y luego el traste 6, has subido un semitono. Si vas del 5 al 7, has subido un tono (dos semitonos).</p><ul><li>Semitono = 1 traste</li><li>Tono = 2 trastes</li><li>Tono y medio = 3 trastes</li></ul><p>Toda escala es una receta hecha con estos pasos. En las siguientes lecciones los usarás.</p>'+row([sb('Oír un semitono','int:1'),sb('Oír un tono','int:2')]);}},
 {id:'mayor',t:'La escala mayor',hook:'La escala de "do re mi fa sol la si do". Suena alegre y estable, y es la base de casi todo.',
  body:function(){return'<p>Su receta de pasos es:</p><div class="formula">T T S T T T S</div><p class="muted">T = tono (2 trastes) · S = semitono (1 traste)</p><p>Empieza en Do y sale <b>Do Re Mi Fa Sol La Si</b> sin ninguna alteración. Pero la receta funciona desde cualquier nota. Desde La da <b>La Si Do♯ Re Mi Fa♯ Sol♯</b>.</p><p>Cada nota tiene un número, su <b>grado</b>: 1 es la tónica (la nota de casa), 2 la segunda, y así hasta 7.</p>'+row([sb('Escuchar Do mayor','play:majC',1),sb('Ver La mayor en el mástil','go:fret:13:major')]);}},
 {id:'menor',t:'La escala menor',hook:'Misma idea, pero más oscura y emotiva. Es la escala de las baladas tristes y del rock.',
  body:function(){return'<p>Su receta es:</p><div class="formula">T S T T S T T</div><p>Comparada con la mayor, la <b>3ª, la 6ª y la 7ª bajan medio tono</b>. Ese pequeño cambio en la 3ª es lo que cambia el carácter de alegre a triste.</p><ul><li><b>Relativas:</b> cada mayor tiene una menor con sus mismas notas. La relativa menor de Do mayor es La menor (tres trastes más abajo).</li><li><b>Armónica y melódica:</b> son variantes de la menor que cambian la 7ª (y la 6ª) para sonar más "clásicas".</li></ul>'+row([sb('Do mayor y luego Do menor','play:minC',1),sb('Ver La menor','go:fret:13:natmin')]);}},
 {id:'intervalos',t:'Intervalos',hook:'Un intervalo es la distancia entre dos notas. Reconocerlos de oído es como aprender a leer.',
